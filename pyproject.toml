[project]
name = "npu-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmytro Derhachov", email = "dergachovda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openvino>=2026.4.1",
    "openvino-genai>=2026.4.1.0",
    "psutil>=7.2.2",
]

[project.scripts]
npu-llm = "npu_llm.__main__:main"
validation = "npu_llm.checks:validation"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "N", "D"]
ignore = [
    "D100",
    "D104",
    "D203",
    "D213",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
